[project]
name = "whatsapp-conversation-analyzer"
version = "0.1.0.dev0"
description = "Local, terminal-based analysis of WhatsApp conversation exports with deterministic engagement metrics and optional LLM classification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matheus Pimentel" }]
keywords = ["whatsapp", "conversation-analysis", "cli", "llm", "data-pipeline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.28",
    "rich>=13.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Official SDKs of the real LLM providers. The base install needs none of them.
openai = ["openai>=3.49,<4"]
anthropic = ["anthropic>=2.7,<3"]
providers = ["openai>=3.49,<4", "anthropic>=2.7,<3"]

[project.scripts]
whatsapp-analyzer = "whatsapp_analyzer.cli.app:main"

[dependency-groups]
dev = [
    "anthropic>=2.7,<3",
    "mypy>=1.13",
    "openai>=3.49,<4",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "PL", "TRY"]
ignore = [
    "PLR2004",  # magic values are clearer than named constants in tests and thresholds
    "TRY003",   # messages are built at the raise site on purpose
]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.per-file-ignores]
"src/whatsapp_analyzer/cli/commands/*" = ["PLR0913", "PLR0917"]  # one parameter per CLI option
"tests/**" = ["PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pytest_socket"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"
xfail_strict = true
markers = [
    "live: real provider calls; skipped unless explicitly authorized (see tests/live/README.md)",
]
