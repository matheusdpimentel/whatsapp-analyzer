# Built-in price table (per million tokens, decimal strings).
# Every real entry records its source and the date it was retrieved; prices change, so an
# entry older than 90 days is reported as stale. Add or override entries in
# <workspace>/pricing.toml (same format). Costs computed from these prices are estimates,
# never an exact bill. cache_write is the default (shortest) cache duration; this project
# does not request prompt caching itself.
schema = 1

[[prices]]
provider = "fake"
model = "fake-classifier"
currency = "USD"
unit = "per_million_tokens"
input = "0"
cache_read = "0"
cache_write = "0"
output = "0"
effective_from = 2026-01-01
source = "Offline test provider of this project; never billed."

[[prices]]
provider = "anthropic"
model = "claude-haiku-5-5"
currency = "USD"
unit = "per_million_tokens"
input = "0.10"
cache_read = "0.01"
cache_write = "0.125"
output = "0.50"
# Prompts over 100,000 tokens (cache reads and writes included) pay higher prices.
max_input_tokens = 100000
long_input = "0.50"
long_cache_read = "0.05"
long_cache_write = "0.625"
long_output = "2.50"
effective_from = 2026-11-10
retrieved_at = 2026-11-10
source = "https://platform.claude.com/docs/en/about-claude/pricing (short: prompts up to 100,000 tokens; long: over 100,000)"

