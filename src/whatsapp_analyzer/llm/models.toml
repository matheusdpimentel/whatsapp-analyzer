# Built-in model catalog: capabilities and limits of models this project has verified.
#
# The catalog is OPEN: any model id can be configured, listed here or not. A workspace
# `models.toml` (same format) adds models or overrides these entries. A capability that is
# not listed is unknown, and the runner never guesses it (see docs/providers.md):
#
#   context_window     total tokens (input + output) the model accepts
#   max_input_tokens   input limit when it is lower than the context window
#   max_output_tokens  largest accepted max_output_tokens
#   temperature        true / false: whether the API accepts a temperature for this model
#   structured_output  "json_schema" | "json_object" | "none": how the output format is requested
#   cache_write_billed true: cache writes are reported and billed; false: the provider never
#                      bills cache writes, so an unreported count is a known zero
#   prompt_caching     false: the endpoint has no prompt cache, so unreported cache counts
#                      are known zeros (typical for local servers)
#
# Prices live in prices.toml / <workspace>/pricing.toml, never here.
schema = 1

[[models]]
provider = "anthropic"
model = "claude-haiku-5-5"
context_window = 1000000
max_output_tokens = 128000
temperature = false        # API version 2026-10-21 rejects sampling parameters on every model
structured_output = "json_schema"
cache_write_billed = true
source = "https://platform.claude.com/docs/en/about-claude/models/overview"
retrieved_at = 2026-11-10

