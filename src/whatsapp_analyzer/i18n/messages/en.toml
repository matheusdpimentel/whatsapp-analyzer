# Reference catalog. Keys are stable identifiers; values use str.format placeholders.

[cli]
help = "Analyze WhatsApp conversation exports locally, with deterministic metrics and optional LLM classification."

[cli.option]
json = "Write machine-readable JSON to stdout. Human-readable messages go to stderr."
lang = "Interface language: en or pt-BR."
version = "Show the version and exit."

[cli.error]
label = "Error"
unsupported_language = "Unsupported language '{value}'. Supported languages: {supported}."
internal = "Unexpected internal error ({error_type}). Set WCA_DEBUG=1 to show the traceback."
interrupted = "Interrupted by the user."
missing_command = "No command given."
usage_hint = "Run '{prog} --help' to see the available commands and options."
database = "Database error ({error_type}: {reason}). Check free disk space and file permissions."

[doctor]
help = "Check the local environment. Sends no data anywhere."
title = "Environment check"
summary = "{ok} ok, {fail} failures"
failed = "One or more environment checks failed."

[doctor.column]
check = "Check"
status = "Status"
details = "Details"

[doctor.status]
ok = "ok"
fail = "failed"
info = "info"

[doctor.check.python_version]
label = "Python"
ok = "Python {version}"

[doctor.check.platform]
label = "Operating system"
value = "{system} {release} ({machine})"

[doctor.check.cpu_count]
label = "CPU cores"
value = "{count} logical cores"
unavailable = "Could not be determined"

[doctor.check.memory_total]
label = "Physical memory"
value = "{gib} GiB total"
unavailable = "Could not be determined on this platform"

[doctor.check.disk_free]
label = "Free disk space"
value = "{gib} GiB free in {path}"
unavailable = "Could not be determined for the current directory"

[doctor.check.sqlite]
label = "SQLite"
ok = "SQLite {version}, WAL mode supported"
fail = "SQLite {version} does not support WAL mode"

[doctor.check.provider_sdks]
label = "LLM provider SDKs"
value = "Installed: {packages}"
none = "None installed (LLM stages are optional)"

[doctor.check.credentials]
label = "Provider credentials"
value = "Set in the environment: {names}"
none = "No provider API keys found in the environment"

[demo_data]
help = "Generate a synthetic demo dataset: WhatsApp TXT exports, CSV and XLSX. No real data is used."
done = "Synthetic dataset written to {path}"
summary = "{conversations} conversations, {messages} messages, {files} files"
notice = "All names, phone numbers and messages are fictional."

[demo_data.arg]
output_dir = "Directory to write the dataset to."

[demo_data.option]
conversations = "Number of profile-based conversations. Two edge-case conversations are always added."
seed = "Random seed. The same seed always produces the same dataset."
locale = "Language of the generated conversations and export formats."
platform = "Which WhatsApp export formats to write."
overwrite = "Write into a directory that is not empty. Files from a previous dataset listed in its manifest are replaced; other files are kept."

[demo_data.error]
not_empty = "The directory '{path}' is not empty."
not_empty_hint = "Choose an empty directory or pass --overwrite."
not_a_directory = "'{path}' exists and is not a directory."
not_writable = "Could not write the dataset to '{path}': {reason}."

[import]
help = "Import and validate conversation exports (iMazing TXT, WhatsApp TXT, CSV, XLSX). Optionally write them as a normalized CSV."
progress = "Reading file {index}/{total} ({records} records)"
written = "Normalized CSV written: {records} records to {path}"
not_written = "No normalized CSV was written because the import failed."
file_label = "file #{index}"

[import.arg]
paths = "Files or directories to import. Directories are read non-recursively."

[import.option]
format = "Input format. 'auto' detects it from the file extension and content."
owner = "Display name of the account owner. Required for WhatsApp TXT exports to tell sent from received messages; elsewhere it labels sent messages."
date_order = "Date order for WhatsApp TXT exports whose dates are ambiguous: dmy, mdy or ymd."
mapping = "Column mapping for CSV/XLSX: a TOML mapping file or a preset name (canonical, imazing-csv)."
map = "Map one canonical field to a source column, e.g. --map timestamp=sent_at. Can be repeated."
sheet = "XLSX worksheet to read."
header_row = "XLSX row number that contains the column names."
encoding = "Text encoding of TXT/CSV inputs when it is not UTF-8, e.g. cp1252."
delimiter = "CSV delimiter when automatic detection is not wanted."
normalized_out = "Write the accepted messages to this CSV file in the canonical column layout."
overwrite = "Replace the normalized CSV file if it already exists."
drop_duplicates = "Remove exact duplicate messages. By default they are kept and reported, because exports without seconds make genuine repeated messages look identical."
strict = "Fail when any record is invalid, not only when a whole file is rejected."
show_file_names = "Show file names in the report. They are hidden by default because they often contain contact names."
workspace = "Store the accepted conversations in this workspace (see 'init'). Nothing is stored unless every file is accepted."
replace_unrelated = "Allow a conversation to be replaced by content that shares no message with its current version. Without it, such an import is refused because it is probably a different chat with the same name."

[import.error]
rejected = "{rejected} of {total} files were rejected; nothing was written."
no_inputs = "No input files were found."
strict = "{invalid} invalid records found and --strict was given."
output_exists = "The output file '{path}' already exists."
output_is_directory = "'{path}' is a directory, not a file."
not_writable = "Could not write the normalized CSV to '{path}': {reason}"
invalid_override = "Invalid column mapping '{value}'. Use FIELD=COLUMN with a canonical field name."
drop_duplicates_workspace = "--drop-duplicates cannot be used with --workspace: the workspace keeps the original records."
replacement_conflict = "{conversations} conversations would be replaced by content that shares no message with the stored version (files {files}). Nothing was stored."

[import.hint]
mapping = "See docs/input-formats.md for mapping files and the canonical field names."
overwrite = "Choose another file or pass --overwrite."
rejected = "Check the rejected files above; --show-file-names lists their names."
no_inputs = "Pass .txt, .csv or .xlsx files, or a directory that contains them (with --format, only that format's extension is read)."
drop_duplicates_workspace = "To count exact repeats once in metrics, set duplicates = \"collapse\" in the [metrics] section of analyzer.toml."
replacement_conflict = "Check whether these files really are newer exports of the same chats. If they are, run again with --replace-unrelated."

[import.summary]
title = "Import summary"
files_inspected = "Files inspected"
files_accepted = "Files accepted"
files_rejected = "Files rejected"
records_read = "Records read"
records_valid = "Valid records"
records_invalid = "Invalid records"
duplicates = "Duplicate records"
conversations = "Conversations"
period = "Period"
formats = "Formats"

[import.issues]
title = "Findings"

[import.issues.column]
code = "Code"
severity = "Severity"
count = "Count"
meaning = "Meaning"

[import.severity]
error = "error"
warning = "warning"
info = "info"

[import.issue]
MALFORMED_RECORD = "Record could not be parsed; it was skipped."
INVALID_TIMESTAMP = "Timestamp could not be read; the record was skipped."
MISSING_REQUIRED_FIELD = "A required field is empty; the record was skipped."
INVALID_DIRECTION = "Direction value is not recognized; the record was skipped."
INVALID_VALUE = "message_type or media_kind value is not recognized; the record was skipped."
DUPLICATE_RECORD = "Exact duplicate of an earlier message; kept unless --drop-duplicates."
TIMESTAMP_OUT_OF_ORDER = "Message is older than the one before it; source order is kept."
CONTROL_CHARACTERS_REMOVED = "Control characters were removed from the text."
EMPTY_MESSAGE = "Message without text or attachment; kept as an empty text message."
TITLE_CHANGED = "The chat title changed within the file."
REPLY_QUOTE_REMOVED = "A reply quote was removed from the text (not part of the canonical schema)."
REACTIONS_REMOVED = "Reactions were removed from the text (not part of the canonical schema)."
EMPTY_ROW = "Empty row skipped."
OWNER_NOT_IN_FILE = "The --owner name never appears as a sender in this file: every message counts as received. Check the spelling if that is unexpected."

[import.rejected]
title = "Rejected files"

[import.rejected.column]
file = "File"
code = "Code"
reason = "Reason"

[import.input_error]
FILE_NOT_FOUND = "File not found."
PERMISSION_DENIED = "Permission denied."
UNSUPPORTED_FORMAT = "Unsupported file format."
UNSUPPORTED_ENCODING = "The file is not valid UTF-8 (or the given encoding). Pass --encoding."
EMPTY_FILE = "The file is empty."
HEADER_NOT_FOUND = "No header row fits a column mapping. Pass --mapping, --map or --header-row."
INVALID_COLUMN_MAPPING = "The column mapping does not fit this file."
MISSING_REQUIRED_COLUMNS = "Required fields are not mapped to any column. Pass --mapping or --map."
SHEET_NOT_FOUND = "The requested worksheet does not exist."
AMBIGUOUS_SHEET = "Several worksheets could contain the data. Pass --sheet."
SPREADSHEET_CORRUPTED = "The spreadsheet could not be opened; it may be corrupted or not an .xlsx file."
AMBIGUOUS_DATE_ORDER = "Day and month order cannot be inferred from the dates. Pass --date-order."
MIXED_DATE_FORMATS = "The file mixes day-first and month-first dates."
OWNER_REQUIRED = "WhatsApp TXT exports need --owner to tell sent from received messages."
NO_VALID_RECORDS = "The file contains no valid records."
CONVERSATION_ID_CONFLICT = "Another file in this import contains a conversation with the same ID (for TXT files: the same file name), so two conversations would be merged. Rename one of the files or import them separately."

[import.workspace]
title = "Workspace"
unchanged = "Workspace unchanged: every conversation is identical to its stored version."
conversations_new = "New conversations"
conversations_changed = "Changed conversations (new version stored)"
conversations_unchanged = "Unchanged conversations"
versions_reactivated = "Earlier versions made current again"
messages_stored = "Messages stored"

[workspace.option]
workspace = "Workspace directory. Defaults to WCA_WORKSPACE, then the current directory."

[workspace.error]
not_found = "No workspace found at '{path}' (analyzer.toml and analyzer.db are required)."
workspace_exists = "'{path}' already contains a workspace."
not_a_directory = "'{path}' is not a directory."
busy = "Another command is writing to the workspace '{path}'."
directory_not_empty = "'{path}' is not empty. Create the workspace in a new or empty directory, so that its .gitignore keeps the database out of version control."
not_writable = "Could not create the workspace at '{path}': {reason}"

[workspace.hint]
init = "Create one with 'whatsapp-analyzer init DIR', or pass --workspace DIR."
busy = "Wait for it to finish. Reading commands (status, export, metrics compare) can run meanwhile."

[workspace.database_error]
DATABASE_NOT_FOUND = "The database '{path}' does not exist."
NOT_A_DATABASE = "'{path}' is not a SQLite database or is damaged."
NOT_AN_ANALYZER_DATABASE = "'{path}' is a SQLite database that was not created by whatsapp-analyzer."
DATABASE_TOO_NEW = "'{path}' uses schema version {version}, but this version of the tool supports up to {supported}. Upgrade the tool."
WAL_UNAVAILABLE = "SQLite cannot use WAL mode for '{path}' (network or read-only file system?)."
MIGRATION_FAILED = "Could not update the schema of '{path}' ({error}). The database was left unchanged."

[config]
hint = "See docs/metrics.md for every setting and its allowed values."

[config.error]
not_applicable = "Setting '{key}' does not apply to provider '{provider}'."
invalid_env_name = "Setting '{key}' must be the NAME of an environment variable (letters, digits and _; not starting with a digit), never the key itself."
duplicate_model = "Two entries in '{key}' describe the same provider and model."
missing_file = "Configuration file '{path}' not found."
unreadable = "Configuration file '{path}' cannot be read as UTF-8 text."
syntax = "Configuration file '{path}' is not valid TOML: {reason}"
unknown_key = "Unknown setting '{key}'."
wrong_type = "Setting '{key}' must be a {expected}."
out_of_range = "Setting '{key}' must be between {minimum} and {maximum}."
invalid_date = "Setting '{key}' must be \"dataset_max\" or a date in YYYY-MM-DD format."
invalid_choice = "Setting '{key}' must be one of: {choices}."
threshold_order = "'{key}' must be greater than '{other}', and both must be greater than 0."
weights_zero = "At least one weight in '{key}' must be greater than 0."
target_exceeds_lookback = "'{key}' cannot exceed '{limit_key}': the target could never be reached."
missing_key = "Setting '{key}' is required."
duplicate_price = "Two price entries in '{key}' have the same provider, model and effective date."

[init]
help = "Create a workspace: configuration file and SQLite database. The directory is ignored by Git."
created = "Workspace created at {path}."
next_steps = "Next: whatsapp-analyzer import FILES --workspace {path}, then whatsapp-analyzer metrics run --workspace {path}."

[init.arg]
directory = "Directory for the workspace. Created if it does not exist."

[metrics]
help = "Compute deterministic engagement metrics (no LLM) and compare scoring configurations."
progress = "Scoring conversations {done}/{total}"

[metrics.run]
help = "Compute raw metrics and scores for the current conversations. Unchanged results are reused."
new = "Run {run_id} completed. Reference date: {reference_date} ({source})."
resumed = "Run {run_id} resumed and completed. Reference date: {reference_date} ({source})."
reused = "Up to date: run {run_id} already has these results. Reference date: {reference_date} ({source}). Use --force for a new run."
details = "{total} conversations; raw metrics computed: {computed}, reused: {reused}; metrics {metrics_hash}, scoring {scoring_hash}."

[metrics.compare]
help = "Compare the levels of two runs (aggregate counts only)."
title = "Comparison"
partial = "Run {run_id} is partial: it does not cover every conversation."
compared = "Conversations compared (same data version)"
agreement = "Same level in both runs"
mean_absolute_score_difference = "Mean absolute score difference"
only_in_a = "Only in the first run"
only_in_b = "Only in the second run"
different_data_version = "Not compared: data changed between the runs"
changed_settings = "Changed settings"
matrix = "Level transitions (rows: run {run_a}, columns: run {run_b})"

[metrics.option]
config = "Read the settings from this file instead of the workspace's analyzer.toml."
reference_date = "Reference date (YYYY-MM-DD) for this run, overriding the configuration."
force = "Create a new run even if an identical complete run exists."

[metrics.arg]
run_a = "First run ID (see 'status')."
run_b = "Second run ID."

[metrics.error]
no_conversations = "The workspace has no conversations to score."
no_runs = "The workspace has no runs yet."
run_not_found = "Run {run_id} does not exist."

[metrics.hint]
no_conversations = "Import conversations first: whatsapp-analyzer import FILES --workspace DIR."
no_runs = "Create one with: whatsapp-analyzer metrics run."
status = "List the runs with: whatsapp-analyzer status."

[metrics.reference_source]
option = "from --reference-date"
config = "fixed in the configuration"
dataset_max = "latest message in the workspace"

[metrics.levels]
title = "Levels"

[metrics.levels.column]
level = "Level"
count = "Conversations"

[status]
help = "Show the workspace contents and recent runs (aggregate counts only)."
title = "Workspace"
conversations = "Conversations"
groups = "Group conversations (not comparable)"
with_earlier_versions = "Conversations with earlier versions"
messages_current = "Messages (current versions)"
versions_superseded = "Superseded versions kept"
imports = "Imports"
metric_configs = "Metric configurations"
runs_total = "Runs"
formats = "Conversations by format"
no_runs = "No runs yet. Run: whatsapp-analyzer metrics run."

[status.warning]
several_formats = "{count} conversation keys exist in more than one format. They are kept as separate conversations; importing the same chats from two exporters counts them twice."

[status.runs]
title = "Recent runs"

[status.runs.column]
id = "Run"
status = "Status"
reference_date = "Reference date"
scored = "Scored"
data = "Data"

[status.run_status]
running = "running"
incomplete = "incomplete"
complete = "complete"

[status.data]
current = "current"
outdated = "outdated"

[export]
help = "Export the metrics and scores of a run to CSV, with a .meta.json file describing it."
written = "{rows} rows of run {run_id} written to {path}."

[export.option]
out = "CSV file to write. Metadata goes to FILE.meta.json."
run = "Run to export. Defaults to the most recent run."
overwrite = "Replace the output files if they exist."

[export.error]
output_exists = "The output file '{path}' already exists."
invalid_path = "Cannot write to '{path}': it is a directory or its parent directory does not exist."
not_writable = "Could not write '{path}': {reason}"

[export.hint]
overwrite = "Choose another file or pass --overwrite."

[export.warning]
partial = "This run is {status}: the export contains only the conversations scored so far."
outdated = "Data changed after this run: {superseded} rows were computed from earlier conversation versions (column data_version)."

[llm]
help = "LLM classification: prompt templates, offline previews, and runs with the configured provider. Only 'llm run' with a real provider sends content, and only after explicit authorization."

[llm.prompts]
help = "List the available prompt templates with their versions and hashes."
title = "Prompt templates"
invalid = "Template file '{file}' was skipped: {reason}"

[llm.prompts.column]
id = "Template"
version = "Version"
origin = "Origin"
hash = "Hash"

[llm.preview]
help = "Prepare the request for one conversation locally and show its structure. Nothing is sent to any provider."
title = "Prepared request (not sent)"
estimate = "~{value} (estimate)"
simulation = "Offline simulation with the fake provider: status {status}, label {label}."
written = "Masked prompt written to {path} (readable only by you)."
written_windows = "Masked prompt written to {path}. On Windows the file permissions follow the directory: keep it in a private folder."
masking_notice = "Masking replaces common identifiers (pseudonymization); it does not make the text anonymous."
cost_unknown = "unknown (missing: {missing})"
cost_estimate = "at most {total} {currency} (estimate)"

[llm.preview.arg]
conversation = "Conversation key, as imported (for TXT files, the file name without extension)."

[llm.preview.option]
source_format = "Source format of the conversation when the same key exists in several formats."
prompt = "Template id, id@version or a .md file. Defaults to \\[llm] prompt in analyzer.toml."
config = "Read the settings from this file instead of the workspace's analyzer.toml."
simulate = "Also run the request through the offline fake provider and show the outcome."
show_content = "Print the masked prompt. Requires confirmation."
out = "Write the masked prompt to this file (mode 600). Requires confirmation."
overwrite = "Replace the --out file if it exists."
confirm_content = "Confirm content output without an interactive prompt (scripts and agents). It confirms only --show-content and --out."
allow_git_worktree = "Allow --out inside a Git work tree (outside a workspace)."

[llm.preview.error]
GROUP_EXCLUDED = "Group conversations are excluded from LLM analysis (set [llm.context] include_groups = true to change this)."
NO_MESSAGES = "The conversation has no messages to analyze."
CONTEXT_BUDGET_EXCEEDED = "The latest message, together with the notice about omitted messages, does not fit in [llm.context] max_context_tokens."
CONVERSATION_NOT_FOUND = "No conversation with this key exists in the workspace."
AMBIGUOUS_CONVERSATION = "{count} conversations with this key exist in different formats."
confirmation_required = "Showing or writing prompt content needs confirmation, and no interactive terminal is available."
not_confirmed = "Content output was not confirmed."
OUTPUT_EXISTS = "The output file '{path}' already exists."
OUTPUT_IS_SYMLINK = "'{path}' is a symbolic link; refusing to write through it."
OUTPUT_IS_DIRECTORY = "'{path}' is a directory."
OUTPUT_PARENT_MISSING = "The directory of '{path}' does not exist."
OUTPUT_IN_GIT_WORKTREE = "'{path}' is inside a Git work tree and Git does not ignore it, so the content could be committed by mistake."
OUTPUT_LOCATION_CHANGED = "The output directory of '{path}' changed after it was checked; nothing was written."

[llm.preview.hint]
source_format = "Pass --source-format (see 'status' for the formats in the workspace)."
confirm_content = "Pass --confirm-content to confirm explicitly."
overwrite = "Choose another file or pass --overwrite."
git_worktree = "Write inside the workspace or outside the repository, or pass --allow-git-worktree."

[llm.preview.warning]
content = "The prompt contains your messages after masking. Masking is not anonymization."
flags = "Security flags are risk signals from heuristics, not proof of an attack. They do not change any classification."

[llm.preview.prompt]
confirm = "Type '{word}' to show or write the content"

[llm.preview.row]
conversation = "Conversation"
provider = "Provider / model"
template = "Template"
messages_shown = "Messages shown"
messages_omitted = "Earlier messages omitted"
messages_truncated = "Messages shortened"
masking = "Masked identifiers"
input_tokens = "Input tokens"
max_output = "Maximum output tokens"
cost = "Cost"
security_flags = "Security flags"
request_id = "Request id"

[llm.prompt_error]
hint = "See docs/llm.md for the template format."
missing_front_matter = "The template must start with a TOML front matter between '+++' lines."
front_matter_syntax = "The template front matter is not valid TOML: {reason}"
unknown_key = "Unknown front matter key '{key}'."
missing_key = "The front matter key '{key}' is required."
wrong_type = "Front matter key '{key}' must be: {expected}."
invalid_id = "The template id must use lowercase letters, digits and dashes."
invalid_version = "The template version must look like 1.0.0."
unknown_output_schema = "Unknown output schema in '{key}'."
variables_mismatch = "Declared variables and placeholders differ (undeclared: {undeclared}; unused: {unused})."
unknown_section = "Unknown section '## {section}'. Only '## system' and '## user' are allowed."
duplicate_section = "Section '## {section}' appears twice."
text_before_section = "Text appears before the first section."
missing_section = "Section '## {section}' is missing or empty."
values_mismatch = "Template values differ from its variables (missing: {missing}; unexpected: {unexpected})."
file_not_found = "Template file '{path}' not found."
unreadable = "Template file '{path}' cannot be read as UTF-8 text."
manifest_mismatch = "Built-in template '{file}' does not match its manifest entry."
unknown_template = "No template '{reference}' found."
unknown_template_with_invalid = "No valid template '{reference}' found. These template files are invalid and were skipped: {invalid}."
duplicate_template = "Template '{reference}' is defined more than once."

[llm.run]
help = "Classify conversations with the configured provider (offline fake, OpenAI, Anthropic or an OpenAI-compatible endpoint), with checkpoints, resumption, reuse, rate limits and budgets. Real providers need explicit authorization (--authorize-send)."
progress = "LLM jobs {done}/{total} (failed {failed}, awaiting reconciliation {reconcile})"

[llm.run.option]
authorize_send = "Authorize sending prepared conversation content to this destination (exactly the configured identity, e.g. anthropic). Needed for every real-provider run that may send; it never lifts budgets or limits."
config = "Read the settings from this file instead of the workspace's analyzer.toml."
conversation = "Only this conversation key. Can be repeated. The selection is frozen in the run."
run = "Resume or requeue this run ID instead of the run matching the current configuration and scope."
force = "Plan a new run even if a run with the same configuration and scope exists. Identical requests are still reused unless --no-reuse is given."
reuse = "Reuse earlier successful results of identical requests (same provider and request id). --no-reuse calls the provider again; it does not create a new run by itself."
retry_failed = "Send failed jobs again. Jobs awaiting reconciliation are never included."
resend_unknown = "Send jobs awaiting reconciliation again. Their earlier attempt may already have been processed and billed."
concurrency = "Maximum requests in flight (default from \\[llm.limits], 4)."
rpm = "Maximum requests per minute (default from \\[llm.limits], 60)."
tpm = "Maximum estimated tokens per minute (default: no limit)."
max_tokens = "Stop before the run's estimated and reported tokens, including reservations, would exceed this."
max_cost = "Do not dispatch an attempt when the run's cost plus worst-case reservations (based on estimated tokens) would exceed this amount. Needs a complete price entry."
max_attempts = "Maximum attempts per job for retries that are safe (default 3)."
fake_scenario = "Fake provider behavior for development and demos: valid, review, invalid_json, truncated, refusal, error:KIND, ..."
events = "Write one JSON event per line to this file, or '-' for stderr (identifiers and codes only)."

[llm.run.error]
fake_scenario_real = "--fake-scenario only applies to the offline fake provider, but a real provider is configured."
max_cost = "Invalid --max-cost '{value}': use a non-negative decimal amount such as 1.50."
fake_scenario = "Unknown fake scenario '{value}'. Choices: {choices} (errors as error:KIND)."
no_conversations = "No conversations are selected (check --conversation keys and imports)."
budget_unverifiable = "A cost limit was requested, but the price of this provider and model is missing or incomplete, so no worst-case reservation can be computed."
config_changed = "The configuration differs from the one this run was planned with."
no_runs = "The workspace has no LLM runs yet."
not_found = "LLM run {run_id} does not exist."
conflicting_options = "--run selects an existing run: --conversation and --force cannot be combined with it."

[llm.run.hint]
budget_unverifiable = "Add a complete entry (input, output, cache_read, cache_write, and the long_* rates if it has max_input_tokens) to pricing.toml, or use --max-tokens."
config_changed = "Run without --run to plan a new run with the current configuration."

[llm.run.outcome]
COMPLETED_WITH_FAILURES = "The run finished, but some jobs failed or await reconciliation. See 'llm status'."
BUDGET_REACHED = "The run stopped because the next attempt's estimated worst case would not fit the budget ({reason}). Resume with a higher limit (--max-tokens or --max-cost)."
RUN_PAUSED_ACCOUNT_ERROR = "The run was paused by a provider account error ({reason}). Fix it and run again to resume."
RUN_INTERRUPTED = "The run was interrupted ({reason}). Run the same command again to resume."

[llm.run.mode]
new = "Run {run_id} planned and executed."
resumed = "Run {run_id} resumed."
up_to_date = "Up to date: run {run_id} already has these results. Use --force for a new run."
unchanged = "Run {run_id} has no pending jobs; failed or unreconciled jobs are only sent again with --retry-failed or --resend-unknown."

[llm.status]
help = "Show an LLM run: jobs by status, attempts by billing, tokens, costs and reservations (no content)."
title = "LLM run {run_id}"
partial_cost = "(partial: {count} billed attempts without a cost)"
stale = "This run is marked running but no process holds the workspace: it crashed. The next llm run recovers it."
note = "Reservations use local token estimates: a conservative guide, not a guarantee for real providers."

[llm.status.option]
run = "Run ID. Defaults to the run used most recently."

[llm.status.row]
cost_reviewer = "Known cost (reviewer, this run only)"
status = "Status"
tokens_reported = "Tokens reported by the provider (input / output)"
tokens_estimated = "Tokens estimated locally (input / output)"
cost = "Known cost"
in_flight = "Reserved by attempts in flight (tokens)"
unknown = "Reserved by attempts with unknown billing (tokens)"
committed_tokens = "Committed tokens (consumed + reserved) / limit"
committed_cost = "Committed cost / limit"

[llm.status.job]
succeeded = "Succeeded"
reused = "Reused"
failed = "Failed"
awaiting_reconciliation = "Awaiting reconciliation"
skipped = "Skipped"
pending = "Pending"

[llm.export]
help = "Export the jobs of an LLM run to CSV with a .meta.json file (labels, codes, counts; no content)."
written = "{rows} jobs of LLM run {run_id} written to {path}."
partial = "This run is {status}: the export is a partial snapshot."
reconcile = "{count} jobs await reconciliation (column needs_reconciliation)."

[consent]
title = "Authorization required: conversation content will leave this machine."
destination = "Destination: {identity}  Model: {model}"
summary = "Pending conversations: {jobs}. Distinct requests: {requests} (at most {max_requests} attempts). Worst case: {tokens} tokens, cost {cost}. Budgets and limits still apply."
cost_unknown = "unknown (no complete price for this model)"
prompt = "Type '{identity}' to authorize sending, or press Enter to cancel"

[consent.notice]
sent = "The prepared text of each selected conversation (masked messages, the prompt and the instructions) is sent to the destination for classification."
masking = "Masking is best-effort, not anonymization: names, numbers or other identifying details may still be sent."
remote = "The provider processes the data under its own terms and retention policies."
loopback = "The endpoint is on this machine (loopback), but the service behind it may forward data elsewhere; this tool cannot verify that."

[consent.error]
required = "Sending to '{identity}' needs explicit authorization ({requests} distinct requests pending). Nothing was sent; the run is planned and resumes when authorized."
declined = "Authorization was not given. Nothing was sent; the run is planned and resumes when authorized."
mismatch = "--authorize-send does not name the configured destination '{identity}'. Nothing was planned or sent."

[consent.hint]
flag = "Review the destination and estimate, then run again with: {flag}"

