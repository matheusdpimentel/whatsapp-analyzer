name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # pytest-socket blocks network access: tests must never reach a real provider.
      - run: uv run pytest
      - run: uv run whatsapp-analyzer --json doctor

  package:
    # The built wheel, installed in a clean environment outside the checkout, must run the
    # whole documented workflow (synthetic data, offline fake provider).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean venv and run the quickstart check
        shell: bash
        run: |
          VENV="$RUNNER_TEMP/venv"
          uv venv "$VENV"
          # Windows venvs keep their executables in Scripts/ and need the .exe suffix
          # (uv does not resolve "Scripts/python"); POSIX uses bin/.
          if [ -d "$VENV/Scripts" ]; then
            PY="$VENV/Scripts/python.exe"; EXE="$VENV/Scripts/whatsapp-analyzer.exe"
          else
            PY="$VENV/bin/python"; EXE="$VENV/bin/whatsapp-analyzer"
          fi
          uv pip install --python "$PY" dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" "$GITHUB_WORKSPACE/scripts/check_quickstart.py" "$EXE"
